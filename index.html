<div class="modal" id="wheel-modal">
    <div class="modal-content">
        <div class="modal-title">
            <i class="fas fa-comment-dots"></i><span>请回答</span>
        </div>

        <div class="picker-wrapper">
            <div class="picker-controls">
                <div class="picker-options-label">题目</div>
                <textarea id="wheel-question-input" class="modal-textarea" rows="2"
                    style="width:100%;box-sizing:border-box;font-family:var(--font-family);font-size:13px;line-height:1.6;resize:vertical;padding:10px 12px;border:1px solid var(--border-color);border-radius:10px;background:var(--primary-bg);color:var(--text-primary);outline:none;"
                    placeholder="请输入题目，例如：今晚吃什么？"></textarea>
            </div>

            <div class="picker-controls">
                <div class="picker-options-label">选项（至少 2 项，可自行修改）</div>
                <div class="picker-options-list" id="wheel-options-list"></div>
                <button class="modal-btn modal-btn-secondary picker-add-btn" id="add-wheel-option">
                    <i class="fas fa-plus"></i> 添加选项
                </button>
            </div>

            <div class="picker-box-stage">
                <div class="picker-cards-row" id="picker-cards-row"></div>
                <div class="picker-result-text" id="wheel-result"></div>
            </div>
        </div>

        <div class="modal-buttons">
            <button class="modal-btn modal-btn-secondary" id="close-wheel">关闭</button>
            <button class="modal-btn modal-btn-primary" id="spin-wheel-btn">
                <i class="fas fa-paper-plane" style="margin-right:4px;"></i> 请回答
            </button>
        </div>
    </div>
</div>
